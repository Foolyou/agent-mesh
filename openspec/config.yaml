schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Project: Agent Mesh — a control plane that orchestrates meshes of
  heterogeneous coding agents (claude, codex, opencode) over the Agent Client
  Protocol (ACP). An optional LLM master agent turns natural language into
  mesh lifecycle actions; a React + Bun web console drives the whole plane.

  Tech stack:
  - Runtime: Bun (TypeScript, ESM). No separate bundler/test runner — `bun test`,
    `bun build --compile` for the `dist/mesh` binary.
  - Web: React 19 SPA (src/web/client/) served by a Bun web server
    (src/web/server.ts); REST + a single WebSocket (snapshot + deltas).
  - Protocols: ACP (@zed-industries/agent-client-protocol) agent<->host over
    stdio; MCP (@modelcontextprotocol/sdk) for mesh-control and mesh-services
    (send_mail/check_mail/interrupt); NDJSON over Unix sockets for backend<->host.
  - Process model: process-per-mesh isolation. Each running mesh is a detachable
    mesh-host subprocess (daemon) owning its own ACP clients + mailbox; the
    backend can restart and reconnect. Registry lives under <base>/.agent-mesh/run/.

  Conventions:
  - Conventional commits; small, working commits on feature branches; commit
    messages end with a Co-Authored-By line. One writer edits the tree at a time.
  - TDD: keep `bun test` green. UI changes get a Playwright script in
    src/web/*.e2e.ts (bundled chromium). Update the matching *.e2e.ts on behavior
    changes. Small, single-purpose files; follow existing style.
  - Dev/prod isolation (hard rule): verify only on DEV. Never touch the prod
    instance (port 10010, root ~/.agent-mesh) or ~/.agent-mesh. For manual checks
    spin up a temp dev instance: `bun run src/main.ts --port 10020 --root ~/.agent-mesh-dev`
    then kill it.

  Domain notes:
  - `--root <base>` names a base dir; data lives under <base>/.agent-mesh.
  - Backend service management: `mesh up/down/status/restart/logs` (one backend
    per root). Hot restart keeps agents alive; cold restart reaps the daemon set.
  - A PTY-based prototype (src/pty-*.ts, src/mock-agent.ts, etc.) is retained as
    history but unused — ACP replaced it.

# Per-artifact rules — custom rules for specific artifacts.
rules:
  proposal:
    - State a clear "Non-goals" section.
    - Note any impact on the dev/prod isolation boundary or process model.
  tasks:
    - Pair behavior changes with the corresponding *.e2e.ts or bun test update.
    - Keep tasks small enough to land as a single working commit.
